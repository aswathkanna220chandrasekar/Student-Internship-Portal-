<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Internship Portal</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav>
            <h2>🎓 InternHub</h2>
            <div>
                <a href="#home">Home</a>
                <a href="#internships">Internships</a>
                <a href="#applications">My Applications</a>
            </div>
        </nav>
        <section class="hero" id="home">
            <h1>Find Your Dream Internship</h1>

            <p>Explore opportunities, learn new skills, and start your career.</p>

            <input type="text" id="search" placeholder="Search by internship or company..." oninput="displayInternships()">
        </section>
        <section class="container" id="internships">
            <h2>Available Internships</h2>
            <div class="internship-list" id="internshipList"></div>
        </section>
        <section class="container" id="applications">
            <h2>My Applications</h2>

            <div class="internship-list" id="applicationList"></div>
        </section>
        <footer>
            <p>© 2026 InternHub | Student Internship Portal</p>
        </footer>
    </body>
    <script src="script.js"></script>
</html>
